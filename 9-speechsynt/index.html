<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Текст в речь</title>
</head>
<body>

  <input type="text" id="text" placeholder="Введите текст на русском">
  <button onclick="speak()">Озвучить</button>

  <script>
    function speak() {
      const utterance = new SpeechSynthesisUtterance(document.getElementById('text').value);
      utterance.lang = 'ru-RU';
      speechSynthesis.speak(utterance);
    }
  </script>

</body>
</html>
