<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Color Rectangle</title>
    <style>
        #rect {
            width:200px;
            height:200px;
            border: 1px solid black;
            margin-bottom:10px;
            margin-top:10px;
        }
        button{
            margin-left:40px;
        }
    </style>
</head>
<body>
    <h3>Цветной квадрат</h3>
    <div> <input type="text" value="" id="word"> </div>
    <div id="rect"></div>
    <div>
        <button onclick="start_recogn();">старт</button>
        <button onclick="stop_recogn();">стоп</button>
    </div>
</body>
<script>
//- функции
const c1 = (val, cmt="") => {console.log(cmt,val)}
const e1 = (id)=> document.getElementById(id);

let flag_recog = false

const start_recogn = () => {
    if(!flag_recog){
        recognition.start()
        flag_recog = true
    }
    e1('word').value =''
}

const stop_recogn =()=>{
    recognition.abort()
    flag_recog =false
}

// --Создаем и настраиваем экземпляр SpeechRecognition:
const SpeechRecognition =
 window.SpeechRecognition || window.webkitSpeechRecognition

 const recognition = new SpeechRecognition()
 recognition.continuous = true; // продолжить после первого результата
 recognition.interimResults = true; // обработка промежуточных результатов
 recognition.lang = 'ru-Ru'; //язык

 //-- обработчики событий запуска, ошибки и окончания распознования речи:
 recognition.onstart = () => {c1('Распознавание голоса запущено')}
 recognition.onerror = ({error}) => {c1(error)}
 recognition.onend = () => {c1('Распознавание голоса закончено')}

 //--цвета для оформления квадрата
 const Colors={
    "белый":'white',
    "чёрный":'black',
    "красный":'red',
    "синий":'blue',
    "зеленый":'green',
    "жёлтый":'yellow',
 }

 recognition.onresult = (e) => {
    let i = e.results.length -1
    if (e.results[i].isFinal) {
        let last_text = e.results[i][0].transcript.trim()

        e1('word').value = last_text;
        if(last_text in Colors) {
            let color = Colors[last_text]
            console.log(color)
            e1('rect').style.backgroundColor=color
        }
    }
 }
</script>
</html>
