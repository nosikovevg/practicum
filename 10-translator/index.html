<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Переводчик EN ↔ RU</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 100px; margin: 0.5rem 0; padding: 0.5rem; box-sizing: border-box; }
    .controls { display: flex; gap: 0.5rem; margin: 0.5rem 0; }
    button { padding: 0.5rem 1rem; cursor: pointer; }
    #status { color: #555; font-size: 0.9rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h2>Локальный переводчик (EN ↔ RU)</h2>

  <div class="controls">
    <select id="direction">
      <option value="en-ru">Английский → Русский</option>
      <option value="ru-en">Русский → Английский</option>
    </select>
    <button id="translateBtn">Перевести</button>
  </div>

  <textarea id="input" placeholder="Введите текст для перевода..."></textarea>
  <textarea id="output" placeholder="Результат..." readonly></textarea>
  <div id="status">Готов к работе</div>

  <script>
    const directionSelect = document.getElementById('direction');
    const translateBtn = document.getElementById('translateBtn');
    const inputEl = document.getElementById('input');
    const outputEl = document.getElementById('output');
    const statusEl = document.getElementById('status');

    // Кэш созданных переводчиков для каждого направления
    const translators = {};

    translateBtn.addEventListener('click', async () => {
      const text = inputEl.value.trim();
      if (!text) return;

      if (!('Translator' in self)) {
        statusEl.textContent = 'Ошибка: Translator API не поддерживается в этом браузере.';
        return;
      }

      const [sourceLanguage, targetLanguage] = directionSelect.value.split('-');
      const key = `${sourceLanguage}-${targetLanguage}`;

      translateBtn.disabled = true;

      try {
        if (!translators[key]) {
          statusEl.textContent = 'Проверка доступности модели...';
          const availability = await Translator.availability({ sourceLanguage, targetLanguage });

          if (availability === 'unavailable') {
            statusEl.textContent = 'Языковая пара недоступна на этом устройстве.';
            return;
          }

          translators[key] = await Translator.create({
            sourceLanguage,
            targetLanguage,
            monitor(m) {
              m.addEventListener('downloadprogress', (e) => {
                const percent = Math.round(e.loaded * 100);
                statusEl.textContent = `Загрузка модели: ${percent}%`;
              });
            }
          });
        }

        statusEl.textContent = 'Перевод...';
        outputEl.value = await translators[key].translate(text);
        statusEl.textContent = 'Готово';
      } catch (err) {
        statusEl.textContent = `Ошибка: ${err.message}`;
      } finally {
        translateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
